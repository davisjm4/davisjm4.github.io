name: CS Games Worker production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cs-games-worker-production.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs-games-worker-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect existing Worker without changing production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token || !account) throw new Error('Both Cloudflare repository secrets are required.');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/cs-games-api';
          async function get(path) {
            const r=await fetch(base+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
            const data=await r.json();
            if(!r.ok || !data.success) throw new Error('Cloudflare '+path+' HTTP '+r.status+' codes '+JSON.stringify(data.errors?.map(e=>e.code)));
            return data.result;
          }
          const settings=await get('/settings');
          const deployments=await get('/deployments');
          console.log(JSON.stringify({commit:process.env.GITHUB_SHA,compatibility_date:settings.compatibility_date,compatibility_flags:settings.compatibility_flags,bindings:settings.bindings?.map(b=>({name:b.name,type:b.type,...(b.type==='plain_text'?{text:b.text}:{}),...(b.type==='d1'?{databaseId:b.id}:{} )})),observability:settings.observability,logpush:settings.logpush,deployments},null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Inspected cs-games-api. No production changes.\n');
          JS
