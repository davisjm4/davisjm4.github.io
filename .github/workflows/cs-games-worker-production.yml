name: CS Games Worker production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cs-games-worker-production.yml'
      - '.github/scripts/cs-games-worker-release.mjs'
      - 'wpr-games/workplace-readiness/service/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs-games-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate signed scenarios, permit compatibility and recovery
        run: |
          node wpr-games/workplace-readiness/tools/build-procedural-content.mjs --check
          node --test cs-games/pathway/tests/wpr-procedural.test.mjs cs-games/pathway/tests/mastery-attempt-recovery.test.mjs
      - name: Deploy code while preserving production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/cs-games-worker-release.mjs
      - name: Retain deployment IDs, checks and rollback result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-games-worker-release
          path: ${{ runner.temp }}/cs-games-worker-release/release-report.json
          if-no-files-found: ignore
          retention-days: 30
