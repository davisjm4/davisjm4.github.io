name: CS Games backend integration
on:
  pull_request:
    paths: ['cs-games/student/**', 'cs-games/teacher/**', 'cs-games/pathway/**', 'java-games/session.js', 'csp-games/session.js', 'wpr-games/workplace-readiness/**', '.github/workflows/cs-games-profile-check.yml']
  push:
    branches: [main]
    paths: ['cs-games/student/**', 'cs-games/teacher/**', 'cs-games/pathway/**', 'java-games/session.js', 'csp-games/session.js', 'wpr-games/workplace-readiness/**', '.github/workflows/cs-games-profile-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cs-games/teacher/cs-games-backend-tests.mjs cs-games/teacher/wpr-profile-tests.mjs cs-games/teacher/wpr-online-tests.mjs cs-games/pathway/tests/*.test.mjs
      - run: npm ci --ignore-scripts --prefix wpr-games/workplace-readiness
      - run: CHROME_BIN="$(command -v google-chrome)" node --test cs-games/teacher/wpr-online-browser-tests.mjs cs-games/teacher/automatic-pathway-browser-tests.mjs cs-games/teacher/requirements/integration-browser-tests.mjs
