name: Trace Repair Verification
on:
  push:
    paths:
      - "java-games/**"
      - ".github/workflows/trace-repair-check.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Java Games
        working-directory: java-games
        run: npm install
      - name: Trace 15k audit and JVM verification
        working-directory: java-games
        run: node variable-lab/trace-tests.mjs
      - name: Advanced sample report
        working-directory: java-games
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { generateTraceChallenge, verifyChallengeModel, validateDifficulty } from "./variable-lab/trace-generator/src/index.js";

          for (const seed of [9101, 9102, 9103]) {
            const q = generateTraceChallenge({ difficulty: "advanced", seed });
            const verification = verifyChallengeModel(q);
            const difficulty = validateDifficulty(q.difficultyMetrics, "advanced", { format: q.format, type: q.type });
            const choiceTexts = q.choices.map(choice => choice.text);

            assert.equal(q.difficulty, "advanced", "sample must retain Advanced metadata");
            assert.equal(q.difficultyMetrics.validated, true, "sample must pass generator difficulty validation");
            assert.equal(difficulty.ok, true, `difficulty metrics must validate: ${difficulty.failures.join(", ")}`);
            assert.equal(verification.ok, true, `generated answer must match Java model execution: ${verification.error || verification.text}`);
            assert.equal(new Set(choiceTexts).size, choiceTexts.length, "answer choices must be distinct");
            assert.equal(q.distractors.length, q.choices.length - 1, "every incorrect choice must be explained as a distractor");
            assert.ok(q.distractors.every(d => d.misconceptionId && d.explanation && d.text !== q.correct.text), "distractors must be distinct and misconception-based");

            console.log(JSON.stringify({
              seed,
              difficulty: q.difficulty,
              format: q.format,
              reasoningFamilies: q.reasoningFamilies,
              code: q.code,
              answer: q.correct.text,
              distractors: q.distractors.map(({ text, misconceptionId }) => ({ text, misconceptionId })),
              metrics: {
                relevantChanges: q.difficultyMetrics.relevantChanges,
                dependencyDepth: q.difficultyMetrics.dependencyDepth,
                variablesInSlice: q.difficultyMetrics.variablesInSlice,
                statements: q.difficultyMetrics.statements,
              },
              modelVerified: verification.ok,
            }));
          }
          NODE
      - name: Shared engine regression
        working-directory: java-games
        run: node tests.mjs
      - name: Shared UI regression
        working-directory: java-games
        run: node ui-tests.mjs
      - name: Variable Lab quality regression
        working-directory: java-games
        env:
          JAVA_BIN: java
        run: node quality-tests.mjs
      - name: Compiler and JVM regression
        working-directory: java-games
        run: |
          sudo mkdir -p /usr/lib/jvm/java-17-openjdk-amd64/bin
          sudo ln -sf "$(which java)" /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          node compiler-tests.mjs
