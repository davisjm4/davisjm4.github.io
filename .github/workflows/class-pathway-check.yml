name: Class Learning Pathway Verification
on:
  push:
    branches: [main]
    paths: ['cs-games/pathway/**','cs-games/teacher/pacing/**','wpr-games/workplace-readiness/service/**','.github/workflows/class-pathway-check.yml']
  pull_request:
    paths: ['cs-games/pathway/**','cs-games/teacher/pacing/**','wpr-games/workplace-readiness/service/**','.github/workflows/class-pathway-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cs-games/pathway/tests/*.test.mjs
      - run: node cs-games/pathway/build-graph.mjs && git diff --exit-code -- cs-games/pathway/curriculum-graph.json
      - run: node cs-games/teacher/wpr-online-tests.mjs
      - run: node csp-games/exam-readiness/tests/model.test.mjs && node csp-games/exam-readiness/tests/integration.test.mjs
