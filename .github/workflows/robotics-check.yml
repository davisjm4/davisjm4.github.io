name: Robotics activities verification
on:
  push:
    branches: [main]
    paths: ['cs-games/robotics/**', 'java-games/session.js', 'cs-games/catalog.js', 'cs-games/course-page.js', '.github/workflows/robotics-check.yml']
  pull_request:
    paths: ['cs-games/robotics/**', 'java-games/session.js', 'cs-games/catalog.js', 'cs-games/course-page.js', '.github/workflows/robotics-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identification-and-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ROBOTICS_EVIDENCE=/tmp/robotics-validation node cs-games/robotics/parts-sprint/tests/engine-tests.mjs
      - run: node java-games/session-tests.mjs
      - run: node cs-games/robotics/course-architect/tests/validation.mjs
      - run: npm --prefix java-games install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node cs-games/robotics/course-architect/tests/ui-tests.mjs

      - run: node cs-games/robotics/component-challenge/tests/validate.mjs
      - run: node cs-games/robotics/component-challenge/tests/ui-contract.mjs
