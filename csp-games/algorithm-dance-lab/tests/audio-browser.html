<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dance Lab audio verification</title><style>body{font:16px system-ui;background:#0c1722;color:#eff6fb;margin:24px}button,a{padding:12px;margin:8px;background:#66e4c4;color:#0c1722;border:0;border-radius:8px;display:inline-block}pre{white-space:pre-wrap}h1{font-size:24px}</style></head><body><h1>Audio verification · original generated test material</h1><p>This internal QA page tests the same audio scheduler and browser decoder. It does not require a microphone or an external recording.</p><button id="synth">Run synthesis checks</button><button id="decode">Decode original test recording</button><button id="download">Download original test WAV</button><pre id="result" role="status">Ready.</pre><script type="module">
import {AudioTransport} from '../audio.js';import * as E from '../engine.js';import {createProject,compileProject} from '../project.js';
const out=document.querySelector('#result');
function wav(){const rate=8000,seconds=10,samples=rate*seconds,buffer=new ArrayBuffer(44+samples*2),view=new DataView(buffer),text=(at,s)=>[...s].forEach((c,i)=>view.setUint8(at+i,c.charCodeAt(0)));text(0,'RIFF');view.setUint32(4,36+samples*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples*2,true);for(let i=0;i<samples;i++){const t=i/rate,phase=t%1,envelope=phase<.12?Math.sin(Math.PI*phase/.12)*.2:0;view.setInt16(44+i*2,Math.sin(2*Math.PI*440*t)*envelope*32767,true);}return new Blob([buffer],{type:'audio/wav'});}
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(wav()),a=document.createElement('a');a.href=url;a.download='dance-original-test.wav';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);out.textContent='Original 10-second WAV download created.';};
document.querySelector('#decode').onclick=async()=>{const audio=new AudioTransport();try{const metadata=await audio.inspectFile(wav(),'dance-original-test.wav');if(Math.abs(metadata.duration-10)>.02)throw Error('Unexpected decoded duration.');out.textContent=JSON.stringify({passed:true,test:'HTML audio decode',metadata},null,2);}catch(e){out.textContent=JSON.stringify({passed:false,error:e.message});}finally{audio.dispose();}};
document.querySelector('#synth').onclick=async()=>{let audio;try{out.textContent='Rendering original notes through the browser audio engine…';const context=new OfflineAudioContext(1,48000*1.75,48000);let time=0;const proxy=new Proxy(context,{get(target,key){if(key==='state')return 'running';if(key==='currentTime')return time;const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;},set(target,key,value){Reflect.set(target,key,value,target);return true;}});const program=E.blank(2);program.tracks=[{id:E.id(),name:'Music',body:[E.note('A4',1),E.rest(1),E.note('C5',1)]}];const project=createProject(program);project.musicSource='composer';audio=new AudioTransport({contextFactory:()=>proxy});await audio.start(project,compileProject(project),0,true);time=.9;audio.schedule();const rendered=await context.startRendering(),data=rendered.getChannelData(0),rms=(a,b)=>Math.sqrt(data.slice(a*48000,b*48000).reduce((sum,x)=>sum+x*x,0)/((b-a)*48000)),frequency=(a,b)=>{let count=0;for(let i=Math.floor(a*48000)+1;i<b*48000;i++)if(data[i-1]<=0&&data[i]>0)count++;return count/(b-a);};const measured={firstNoteRms:rms(.1,.35),restRms:rms(.65,.9),secondNoteRms:rms(1.1,1.35),firstNoteHz:frequency(.1,.35),secondNoteHz:frequency(1.1,1.35),scheduling:audio.metrics};const passed=measured.firstNoteRms>.01&&measured.secondNoteRms>.01&&measured.restRms<1e-6&&Math.abs(measured.firstNoteHz-440)<8&&Math.abs(measured.secondNoteHz-523.25)<8;if(!passed)throw Error(JSON.stringify(measured));out.textContent=JSON.stringify({passed:true,test:'Real browser PCM synthesis',measured},null,2);}catch(e){out.textContent=JSON.stringify({passed:false,error:e.message});}finally{audio?.pause();}};
</script></body></html>
