<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathway responsive QA</title><style>body{font:16px system-ui;background:#0c1722;color:#eff6fb;margin:20px}label{display:inline-block;padding:10px}iframe{display:block;height:850px;border:2px solid #ffd273;margin:20px 0;background:#0c1722}input{padding:10px}a{color:#68e0ce}</style></head><body><h1>Pathway responsive QA</h1><p>Internal rendered-browser checks. Frames use the real pathway and the same browser storage.</p><label>Preview width<select id="width"><option>320</option><option>390</option><option>768</option><option>1024</option><option selected>1366</option></select></label><button id="apply">Apply width</button><a href="../">Return to pathway</a><p id="result" role="status"></p><iframe id="preview" title="Pathway at selected viewport width" width="1366" src="../"></iframe><script>const frame=document.getElementById('preview');document.getElementById('apply').onclick=()=>{frame.width=document.getElementById('width').value;measure();};function measure(){const d=frame.contentDocument;if(!d)return;const w=d.documentElement.clientWidth,s=d.documentElement.scrollWidth;document.getElementById('result').textContent=`Viewport ${w}px · Page width ${s}px · ${s<=w?'No horizontal overflow':'OVERFLOW'}`;}frame.onload=measure;window.onresize=measure;</script></body></html>
